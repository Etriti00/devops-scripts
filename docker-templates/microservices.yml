# ─── Microservices Docker Compose ─────────────────────────────────────────────
# API Gateway + Multi-service architecture

version: "3.9"

services:
  # ─── API Gateway (Nginx) ───────────────────────────────────────────────────
  gateway:
    image: nginx:alpine
    container_name: ms_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth-service
      - user-service
      - product-service

  # ─── Auth Service ──────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: ms_auth
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://app:***@db:5432/auth_db
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_PORT=8001
    expose:
      - "8001"

  # ─── User Service ──────────────────────────────────────────────────────────
  user-service:
    build:
      context: ./services/users
      dockerfile: Dockerfile
    container_name: ms_users
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://app:***@db:5432/users_db
      - SERVICE_PORT=8002
    expose:
      - "8002"

  # ─── Product Service ───────────────────────────────────────────────────────
  product-service:
    build:
      context: ./services/products
      dockerfile: Dockerfile
    container_name: ms_products
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://app:***@db:5432/products_db
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - SERVICE_PORT=8003
    expose:
      - "8003"

  # ─── Shared PostgreSQL ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ms_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"

  # ─── RabbitMQ Message Broker ───────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ms_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app_password

volumes:
  postgres_data:
